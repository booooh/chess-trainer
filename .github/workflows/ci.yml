name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the older run. On main, runs queue instead, so a
# production deploy is never cancelled halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright, mobile Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e
      # Deploy exactly the build that passed the e2e tests, rather than building again.
      - name: Keep the tested build for the deploy job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    # Production: pushes to main. Preview: pull requests from branches of this repo.
    # PRs from forks get no secrets, so they're skipped rather than failing (ADR-0009).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # Only builds that pass every check go out, previews included.
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to comment the preview URL
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url || steps.deploy.outputs.deployment-url }}
    # One deploy per branch at a time. A newer PR push replaces an in-progress preview
    # deploy; production deploys are never cut off halfway.
    concurrency:
      group: deploy-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      PROJECT: chess-trainer
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # `wrangler pages deploy` fails if the project doesn't exist, so the first run creates
      # it. Any answer other than "found" or "not found" (e.g. a bad token) fails the job.
      - name: Create the Pages project if needed
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          status=$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$PROJECT")
          case "$status" in
            200) echo "Pages project '$PROJECT' exists." ;;
            404)
              echo "Creating Pages project '$PROJECT' (production branch: main)."
              curl -sS --fail-with-body -X POST "$api" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                --data "{\"name\":\"$PROJECT\",\"production_branch\":\"main\"}"
              ;;
            *)
              echo "::error::Cloudflare API returned HTTP $status for project '$PROJECT'. Check the API token's permissions and the account ID."
              cat response.json
              exit 1
              ;;
          esac

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.166.0'
          # Deploying branch `main` updates production; any other branch makes a preview with
          # a stable alias URL for that branch, plus a unique URL for this deployment.
          command: >-
            pages deploy dist
            --project-name=${{ env.PROJECT }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}

      # Keep a single comment per PR and edit it on each push, instead of adding a new one.
      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- cloudflare-pages-preview -->';
            const { ALIAS_URL, DEPLOY_URL, SHA } = process.env;
            const body = [
              marker,
              '### Preview',
              '',
              `**Open on your phone:** ${ALIAS_URL || DEPLOY_URL}`,
              '',
              `This deployment only: ${DEPLOY_URL}`,
              '',
              `Built from ${SHA.slice(0, 7)}. Previews have their own storage, separate from production.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
