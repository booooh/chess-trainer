<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Chess Trainer has moved</title>
    <link rel="canonical" href="__NEW_URL__" />
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: #2b2622; color: #f2ebe3;
        font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 32rem; padding: 24px 16px; }
      h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
      a.button {
        display: inline-block; margin: 0.5rem 0 1.25rem; padding: 0.75rem 1.25rem;
        border-radius: 8px; background: #d9a45b; color: #2b2622;
        font-weight: 600; text-decoration: none;
      }
      small { color: #bfb3a6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Chess Trainer has moved</h1>
      <p>The app now lives at a new address:</p>
      <a class="button" href="__NEW_URL__">Open Chess Trainer</a>
      <p><small>
        If you installed the app on your phone, remove the old icon and install it again from
        the new address. Games saved here don't move with it, because each address keeps its own
        storage.
      </small></p>
    </main>
  </body>
</html>
